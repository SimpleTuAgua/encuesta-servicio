<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBFAF7">
<title>Tu opinión · SIMPLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#A3A983; --sage-soft:#EEEFE6; --blue:#7A97AB; --blue-deep:#5F7F97; --blue-soft:#EAF0F3;
    --yellow:#F0D283; --yellow-soft:#FBF4DF; --sand:#DCC7B7; --mist:#BECCD5;
    --navy:#3B4A58; --muted:#7B8791; --line:#E4E6E1; --cream:#FBFAF7; --white:#FFFFFF;
    --r-sm:8px; --r:10px; --r-lg:20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{
    background:var(--cream); color:var(--navy);
    font-family:"Nunito Sans","Museo Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; overflow-x:hidden;
  }
  /* Elementos gráficos de marca: brotes y gota */
  .deco{position:fixed; pointer-events:none; z-index:0; opacity:.55}
  .deco.a{right:-40px; top:-30px; width:260px}
  .deco.b{left:-60px; bottom:-40px; width:300px; opacity:.4}
  .drop{position:fixed; pointer-events:none; z-index:0; right:8%; bottom:10%; width:120px; opacity:.18}
  @media (max-width:560px){ .deco.a{width:170px; right:-50px; top:-40px} .deco.b{width:200px; left:-80px} .drop{display:none} }

  header{position:relative; z-index:1; display:flex; justify-content:space-between; align-items:center;
    max-width:720px; width:100%; margin:0 auto; padding:22px 20px 0}
  header img{height:46px; width:auto; display:block}
  .chip{font-family:Montserrat,sans-serif; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    color:var(--blue-deep); background:var(--blue-soft); padding:6px 10px; border-radius:var(--r-sm)}

  main{position:relative; z-index:1; flex:1; display:flex; align-items:center; justify-content:center; padding:24px 16px 32px}
  .card{background:var(--white); width:100%; max-width:640px; border-radius:var(--r-lg);
    border:1px solid var(--line); box-shadow:0 1px 2px rgba(59,74,88,.04), 0 18px 48px -18px rgba(59,74,88,.18);
    padding:36px 36px 30px}
  @media (max-width:560px){ .card{padding:28px 20px 22px} }

  /* Progreso: barra + gota */
  .progress{display:flex; align-items:center; gap:12px; margin-bottom:28px}
  .track{flex:1; height:6px; background:var(--sage-soft); border-radius:99px; position:relative}
  .fill{position:absolute; left:0; top:0; bottom:0; border-radius:99px; background:linear-gradient(90deg,var(--sage),var(--blue)); transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .count{font-family:Montserrat,sans-serif; font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap}
  .count b{color:var(--blue-deep)}

  .eyebrow{font-family:Montserrat,sans-serif; font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--sage); margin:0 0 10px}
  h1{font-family:Montserrat,sans-serif; font-weight:700; font-size:27px; line-height:1.22; letter-spacing:-.01em; margin:0 0 10px; color:var(--navy)}
  @media (max-width:560px){ h1{font-size:22px} }
  .hint{color:var(--muted); margin:0 0 22px; font-size:16px; line-height:1.5}
  .q{animation:in .38s cubic-bezier(.2,.8,.2,1)}
  @keyframes in{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

  /* Escalas */
  .scale{display:grid; gap:8px; margin-top:22px}
  .s11{grid-template-columns:repeat(11,1fr)}
  .s5{grid-template-columns:repeat(5,1fr)}
  @media (max-width:560px){ .s11{grid-template-columns:repeat(6,1fr)} }
  .n{font-family:Montserrat,sans-serif; font-weight:600; font-size:17px; color:var(--navy); background:var(--cream);
    border:1px solid var(--line); border-radius:var(--r); height:52px; cursor:pointer; transition:all .15s}
  .n:hover{border-color:var(--blue); background:var(--blue-soft)}
  .n.sel{background:var(--blue); border-color:var(--blue); color:#fff; transform:translateY(-2px); box-shadow:0 8px 18px -8px rgba(95,127,151,.7)}
  .ends{display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:13px; font-weight:600; margin-top:10px}

  /* Opciones */
  .opts{display:grid; gap:10px; margin-top:6px}
  .opt{display:flex; align-items:center; gap:14px; width:100%; text-align:left; font:inherit; font-size:16.5px; font-weight:600;
    color:var(--navy); background:var(--white); border:1px solid var(--line); border-radius:var(--r);
    padding:16px 16px; cursor:pointer; transition:all .15s}
  .opt:hover{border-color:var(--blue); background:var(--blue-soft)}
  .opt .dot{flex:0 0 22px; height:22px; border-radius:50%; border:1.5px solid var(--mist); display:grid; place-items:center; transition:all .15s}
  .opt.sel{border-color:var(--blue); background:var(--blue-soft)}
  .opt.sel .dot{background:var(--blue); border-color:var(--blue)}
  .opt.sel .dot::after{content:""; width:8px; height:8px; border-radius:50%; background:#fff}

  textarea{width:100%; min-height:130px; margin-top:6px; border:1px solid var(--line); border-radius:var(--r); padding:14px 16px;
    font:inherit; font-size:16px; color:var(--navy); background:var(--cream); resize:vertical; transition:border-color .15s}
  textarea:focus{outline:none; border-color:var(--blue); background:#fff}
  .counter{text-align:right; font-size:12px; color:var(--muted); margin-top:6px}

  .nav{display:flex; gap:10px; margin-top:28px}
  .btn{border-radius:var(--r); padding:16px 18px; font-family:Montserrat,sans-serif; font-size:16px; font-weight:600; cursor:pointer; transition:all .15s; border:1px solid transparent}
  .primary{flex:1; background:var(--blue); color:#fff}
  .primary:hover{background:var(--blue-deep)}
  .primary:disabled{background:var(--mist); cursor:not-allowed}
  .ghost{background:transparent; color:var(--navy); border-color:var(--line); padding-left:22px; padding-right:22px}
  .ghost:hover{border-color:var(--blue)}
  .err{color:#A4573F; font-size:14px; margin-top:12px; min-height:1em}

  /* Bienvenida y cierre */
  .hero{text-align:center; padding:6px 0}
  .hero .icon{width:64px; height:64px; margin:0 auto 18px; border-radius:50%; background:var(--blue-soft); display:grid; place-items:center}
  .hero h1{font-size:30px}
  @media (max-width:560px){ .hero h1{font-size:25px} }
  .hero .hint{max-width:440px; margin-left:auto; margin-right:auto}
  .pills{display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin:6px 0 4px}
  .pill{font-size:13px; font-weight:700; padding:7px 12px; border-radius:var(--r-sm)}
  .pill.y{background:var(--yellow-soft); color:#8A6D1F}
  .pill.s{background:var(--sage-soft); color:#6E7452}
  .pill.b{background:var(--blue-soft); color:var(--blue-deep)}
  .claim{font-family:Montserrat,sans-serif; font-weight:600; color:var(--sage); margin-top:22px; font-size:15px}

  footer{position:relative; z-index:1; text-align:center; color:var(--muted); font-size:12px; padding:0 20px 22px; line-height:1.5}
  footer a{color:var(--blue-deep)}
  :focus-visible{outline:2px solid var(--blue); outline-offset:2px}
</style>
</head>

<main><section class="card" id="app" aria-live="polite"></section></main>

<footer id="foot">Agua sin complicaciones.</footer>

<script>
/* ====== CONFIGURACIÓN ======
   Pega aquí la URL de la app web de Apps Script (termina en /exec). */
const ENDPOINT = "https://script.google.com/macros/u/1/s/AKfycbxYnULgOk7tm88ToISzWMdwiBbK6d1Lg2Ac4H5mgrSLrruLaEq4IkaUtIab0tS-7WT7/exec";
const AVISO_PRIVACIDAD_URL = ""; // liga al aviso de privacidad de Simple (pendiente legal)
const VERSION = "v2-2026-11-09";

const params = new URLSearchParams(location.search);
const cliente = (params.get("cliente") || "").trim();
const hs = (params.get("hs") || "").trim(); // Record ID del contacto en HubSpot (opcional)
const nombre = (params.get("n") || "").trim().split(" ")[0];

const Q = [
  {id:"nps", type:"scale", min:0, max:10, eyebrow:"Recomendación",
   title:"¿Qué tan probable es que recomiendes SIMPLE a un familiar o amigo?",
   lo:"0 · Nada probable", hi:"10 · Muy probable"},
  {id:"satisfaccion", type:"scale", min:1, max:5, eyebrow:"Tu experiencia",
   title:"En general, ¿qué tan satisfecho estás con SIMPLE?",
   lo:"1 · Nada satisfecho", hi:"5 · Muy satisfecho"},
  {id:"calidad_agua", type:"choice", eyebrow:"Tu agua",
   title:"¿Cómo calificas el sabor y la calidad del agua SIMPLE?",
   hint:"Pensando en frescura, sabor y confianza al tomarla todos los días.",
   options:["Excelente","Buena","Regular","Mala"]},
  {id:"problema", type:"choice", eyebrow:"Tu servicio",
   title:"Desde tu instalación o en los últimos 3 meses, ¿tuviste algún problema o falla con tu equipo o servicio?",
   options:["No, todo ha funcionado bien","Sí, y lo resolvieron rápido","Sí, pero tardaron en responder","Sí, y aún no está resuelto"]},
  {id:"soporte", type:"choice", eyebrow:"Soporte",
   title:"¿Cómo calificas el tiempo de respuesta de soporte?",
   options:["Excelente","Bueno","Regular","Malo"],
   showIf:a => a.problema && a.problema !== "No, todo ha funcionado bien"},
  {id:"mejora", type:"text", optional:true, eyebrow:"Último paso",
   title:"¿Qué podríamos mejorar para que tu experiencia con SIMPLE sea aún mejor?",
   hint:"Tus comentarios nos ayudan a seguir cuidando cada detalle.",
   placeholder:"Escribe aquí (opcional)"}
];

const answers = {};
let i = -1; // -1 = bienvenida
const app = document.getElementById("app");
const ICON = `<svg width="30" height="30" viewBox="0 0 100 140" aria-hidden="true"><path d="M50 4C50 4 8 62 8 92a42 42 0 0 0 84 0C92 62 50 4 50 4z" fill="#7A97AB"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function visible(){ return Q.filter(q => !q.showIf || q.showIf(answers)); }

function welcome(){
  app.innerHTML = `<div class="hero q">
    <div class="icon">${ICON}</div>
    <h1>${nombre ? "Hola, " + esc(nombre) + ". " : ""}¿Cómo te va con SIMPLE?</h1>
    <p class="hint">Queremos saber cómo vives tu servicio para seguir cuidando lo que tomas todos los días.</p>
    <div class="pills"><span class="pill y">1 minuto</span><span class="pill s">6 preguntas o menos</span><span class="pill b">Solo para mejorar tu servicio</span></div>
    <div class="nav"><button class="btn primary" id="go" type="button">Comenzar</button></div>
  </div>`;
  document.getElementById("go").onclick = () => { i = 0; render(); };
}

function render(){
  const list = visible(), q = list[i], n = list.length;
  const pct = Math.round((i/n)*100);
  let body = "";
  if(q.type === "scale"){
    const cls = (q.max-q.min+1) === 11 ? "s11" : "s5";
    let b = "";
    for(let v=q.min; v<=q.max; v++) b += `<button class="n ${answers[q.id]===v?'sel':''}" data-v="${v}" type="button" aria-pressed="${answers[q.id]===v}">${v}</button>`;
    body = `<div class="scale ${cls}">${b}</div><div class="ends"><span>${q.lo}</span><span>${q.hi}</span></div>`;
  } else if(q.type === "choice"){
    body = `<div class="opts">` + q.options.map(o =>
      `<button class="opt ${answers[q.id]===o?'sel':''}" data-v="${esc(o)}" type="button" aria-pressed="${answers[q.id]===o}"><span class="dot"></span>${esc(o)}</button>`).join("") + `</div>`;
  } else {
    body = `<textarea id="txt" maxlength="1000" placeholder="${q.placeholder}">${esc(answers[q.id]||"")}</textarea><div class="counter"><span id="cc">${(answers[q.id]||"").length}</span>/1000</div>`;
  }
  const last = i === n-1;
  const can = q.optional || answers[q.id] !== undefined;
  app.innerHTML = `
    <div class="progress"><div class="track"><div class="fill" style="width:${pct}%"></div></div><span class="count"><b>${i+1}</b> de ${n}</span></div>
    <div class="q">
      <p class="eyebrow">${q.eyebrow}</p>
      <h1>${q.title}</h1>
      ${q.hint ? `<p class="hint">${q.hint}</p>` : ""}
      ${body}
    </div>
    <div class="nav">
      ${i>0 ? `<button class="btn ghost" id="back" type="button">Atrás</button>` : ""}
      <button class="btn primary" id="next" type="button" ${can?"":"disabled"}>${last?"Enviar respuestas":"Continuar"}</button>
    </div>
    <div class="err" id="err"></div>`;
  requestAnimationFrame(() => { const f = app.querySelector(".fill"); if(f) f.style.width = Math.round(((i+1)/n)*100)+"%"; });

  app.querySelectorAll(".n,.opt").forEach(btn => btn.onclick = () => {
    answers[q.id] = q.type === "scale" ? Number(btn.dataset.v) : btn.dataset.v;
    if(q.id === "problema" && answers.problema === "No, todo ha funcionado bien") delete answers.soporte;
    app.querySelectorAll(".n,.opt").forEach(b => { b.classList.toggle("sel", b === btn); b.setAttribute("aria-pressed", b === btn); });
    const nx = document.getElementById("next"); nx.disabled = false;
    // Avanza solo tras elegir, para que sea más rápido en celular
    clearTimeout(window._t); window._t = setTimeout(() => { if(i < visible().length-1){ i++; render(); } }, 320);
  });
  const txt = document.getElementById("txt");
  if(txt) txt.oninput = () => { answers[q.id] = txt.value; document.getElementById("cc").textContent = txt.value.length; };
  const back = document.getElementById("back");
  if(back) back.onclick = () => { clearTimeout(window._t); i--; render(); };
  document.getElementById("next").onclick = () => { clearTimeout(window._t); last ? send() : (i++, render()); };
  window.scrollTo({top:0, behavior:"smooth"});
}

async function send(){
  const btn = document.getElementById("next");
  btn.disabled = true; btn.textContent = "Enviando…";
  const payload = {
    cliente, hs, version: VERSION,
    nps: answers.nps, satisfaccion: answers.satisfaccion,
    calidad_agua: answers.calidad_agua, problema: answers.problema,
    soporte: answers.soporte || "", mejora: (answers.mejora || "").trim(),
    utm_source: params.get("utm_source") || "", user_agent: navigator.userAgent
  };
  try{
    // text/plain evita el bloqueo CORS de Apps Script
    await fetch(ENDPOINT, {method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)});
    try{ localStorage.setItem("simple_encuesta_"+VERSION+"_"+cliente, "1"); }catch(e){}
    thanks();
  }catch(e){
    btn.disabled = false; btn.textContent = "Enviar respuestas";
    document.getElementById("err").textContent = "No pudimos enviar tu respuesta. Revisa tu conexión e intenta de nuevo.";
  }
}

function thanks(msg){
  app.innerHTML = `<div class="hero q">
    <div class="icon">${ICON}</div>
    <p class="eyebrow">Gracias</p>
    <h1>${msg || "¡Gracias por tu tiempo!"}</h1>
    <p class="hint">Tus respuestas nos ayudan a cuidar mejor tu agua y tu servicio. Nosotros nos encargamos de todo.</p>
    <p class="claim">Agua sin complicaciones.</p>
  </div>`;
}

(function init(){
  const foot = document.getElementById("foot");
  foot.innerHTML = "Usamos tus respuestas solo para mejorar tu servicio." +
    (AVISO_PRIVACIDAD_URL ? ` <a href="${AVISO_PRIVACIDAD_URL}" target="_blank" rel="noopener">Aviso de privacidad</a>` : "");
  let ya = false;
  try{ ya = localStorage.getItem("simple_encuesta_"+VERSION+"_"+cliente) === "1"; }catch(e){}
  ya ? thanks("Ya recibimos tu respuesta") : welcome();
})();
</script>
