<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Encuesta SIMPLE</title>
<style>
  :root{
    --sage:#A3A983; --blue:#7A97AB; --yellow:#F0D283; --mist:#BECCD5;
    --ink:#1F2D3A; --muted:#5F7180; --line:#D9E1E7; --bg:#EEF2F5; --card:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .card{background:var(--card); width:100%; max-width:640px; border-radius:16px;
    box-shadow:0 10px 30px rgba(31,45,58,.08); padding:28px 24px}
  .top{display:flex; justify-content:space-between; align-items:center; gap:12px}
  .step{color:var(--blue); font-weight:600; font-size:15px}
  .brand{font-weight:800; letter-spacing:.08em; color:var(--sage); font-size:14px}
  .bar{height:8px; background:var(--line); border-radius:99px; margin:12px 0 26px; overflow:hidden}
  .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--sage),var(--blue)); transition:width .3s}
  h1{font-size:26px; line-height:1.2; margin:0 0 8px}
  .hint{color:var(--muted); margin:0 0 20px; font-size:16px}
  .opts{display:grid; gap:10px; margin-bottom:8px}
  .opt{background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:16px; font-size:17px;
    font-weight:600; color:var(--ink); cursor:pointer; text-align:center; font-family:inherit}
  .opt:hover{border-color:var(--blue)}
  .opt.sel{background:var(--blue); border-color:var(--blue); color:#fff}
  .scale{display:grid; gap:6px}
  .scale.s11{grid-template-columns:repeat(11,1fr)}
  .scale.s5{grid-template-columns:repeat(5,1fr)}
  .scale .opt{padding:14px 0; font-size:16px}
  @media (max-width:480px){
    .scale.s11{grid-template-columns:repeat(6,1fr)}
    h1{font-size:22px}
  }
  .ends{display:flex; justify-content:space-between; color:var(--muted); font-size:13px; font-weight:600; margin-top:6px}
  textarea{width:100%; min-height:120px; border:1.5px solid var(--line); border-radius:10px; padding:14px;
    font:inherit; font-size:16px; resize:vertical}
  textarea:focus{outline:none; border-color:var(--blue)}
  .nav{display:flex; gap:10px; margin-top:24px}
  .btn{flex:1; border:0; border-radius:10px; padding:16px; font-size:17px; font-weight:700; cursor:pointer; font-family:inherit}
  .back{flex:0 0 32%; background:#fff; border:1.5px solid var(--line); color:var(--ink)}
  .next{background:var(--yellow); color:var(--ink)}
  .next:disabled{opacity:.45; cursor:not-allowed}
  .err{color:#A33; font-size:14px; margin-top:10px; min-height:1em}
  .legal{color:var(--muted); font-size:12px; margin-top:18px; text-align:center}
  .done{text-align:center; padding:20px 0}
  .done h1{margin-bottom:12px}
</style>
</head>
<body>
<main class="card" id="app" aria-live="polite"></main>

<script>
/* ====== CONFIGURACIÓN ======
   Pega aquí la URL de la app web de Apps Script (termina en /exec). */
const ENDPOINT = "PEGA_AQUI_LA_URL_DE_APPS_SCRIPT";
const AVISO_PRIVACIDAD_URL = ""; // liga al aviso de privacidad de Simple (pendiente legal)
const VERSION = "v1-2026-11-09";

const params = new URLSearchParams(location.search);
const cliente = (params.get("cliente") || "").trim();

const Q = [
  {id:"nps", type:"scale", min:0, max:10,
   title:"¿Qué tan probable es que recomiendes SIMPLE a un familiar o amigo?",
   lo:"0 = Nada probable", hi:"10 = Muy probable"},
  {id:"satisfaccion", type:"scale", min:1, max:5,
   title:"En general, ¿qué tan satisfecho estás con SIMPLE?",
   lo:"1 = Nada satisfecho", hi:"5 = Muy satisfecho"},
  {id:"calidad_agua", type:"choice",
   title:"¿Cómo calificas el sabor y la calidad del agua SIMPLE?",
   hint:"Pensando en frescura, sabor y confianza al tomarla todos los días.",
   options:["Excelente","Buena","Regular","Mala"]},
  {id:"problema", type:"choice",
   title:"Desde tu instalación o en los últimos 3 meses, ¿tuviste algún problema o falla con tu equipo o servicio?",
   options:["No, todo ha funcionado bien","Sí, y lo resolvieron rápido","Sí, pero tardaron en responder","Sí, y aún no está resuelto"]},
  {id:"soporte", type:"choice",
   title:"¿Cómo calificas el tiempo de respuesta de soporte?",
   options:["Excelente","Bueno","Regular","Malo"],
   showIf:a => a.problema && a.problema !== "No, todo ha funcionado bien"},
  {id:"mejora", type:"text", optional:true,
   title:"¿Qué podríamos mejorar para que tu experiencia con SIMPLE sea aún mejor?",
   hint:"Tus comentarios son fundamentales para mejorar nuestro servicio y seguir cuidando cada detalle.",
   placeholder:"Cuéntanos qué podríamos hacer mejor (opcional)."}
];

const answers = {};
let i = 0;
const app = document.getElementById("app");

function visible(){ return Q.filter(q => !q.showIf || q.showIf(answers)); }

function render(){
  const list = visible();
  const q = list[i];
  const n = list.length;
  const pct = Math.round(((i+1)/n)*100);
  let body = "";
  if(q.type === "scale"){
    const cls = (q.max - q.min + 1) === 11 ? "s11" : "s5";
    let b = "";
    for(let v=q.min; v<=q.max; v++){
      b += `<button class="opt ${answers[q.id]===v?'sel':''}" data-v="${v}" type="button">${v}</button>`;
    }
    body = `<div class="scale ${cls}">${b}</div><div class="ends"><span>${q.lo}</span><span>${q.hi}</span></div>`;
  } else if(q.type === "choice"){
    body = `<div class="opts">` + q.options.map(o =>
      `<button class="opt ${answers[q.id]===o?'sel':''}" data-v="${o}" type="button">${o}</button>`).join("") + `</div>`;
  } else {
    body = `<textarea id="txt" maxlength="1000" placeholder="${q.placeholder}">${answers[q.id]||""}</textarea>`;
  }
  const last = i === n-1;
  const can = q.optional || answers[q.id] !== undefined;
  app.innerHTML = `
    <div class="top"><span class="step">Pregunta ${i+1} de ${n}</span><span class="brand">SIMPLE</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <h1>${q.title}</h1>
    ${q.hint ? `<p class="hint">${q.hint}</p>` : ""}
    ${body}
    <div class="nav">
      ${i>0 ? `<button class="btn back" id="back" type="button">Atrás</button>` : ""}
      <button class="btn next" id="next" type="button" ${can?"":"disabled"}>${last?"Enviar":"Continuar"}</button>
    </div>
    <div class="err" id="err"></div>
    ${i===0 ? legal() : ""}`;

  app.querySelectorAll(".opt").forEach(btn => btn.onclick = () => {
    answers[q.id] = q.type === "scale" ? Number(btn.dataset.v) : btn.dataset.v;
    if(q.id === "problema" && !q.showIf && answers.problema === "No, todo ha funcionado bien") delete answers.soporte;
    render();
  });
  const txt = document.getElementById("txt");
  if(txt) txt.oninput = () => { answers[q.id] = txt.value; };
  const back = document.getElementById("back");
  if(back) back.onclick = () => { i--; render(); };
  document.getElementById("next").onclick = () => last ? send() : (i++, render());
}

function legal(){
  const link = AVISO_PRIVACIDAD_URL ? ` Consulta nuestro <a href="${AVISO_PRIVACIDAD_URL}" target="_blank" rel="noopener">aviso de privacidad</a>.` : "";
  return `<p class="legal">Toma 1 minuto. Usamos tus respuestas solo para mejorar tu servicio.${link}</p>`;
}

async function send(){
  const btn = document.getElementById("next");
  btn.disabled = true; btn.textContent = "Enviando…";
  const payload = {
    cliente, version: VERSION,
    nps: answers.nps, satisfaccion: answers.satisfaccion,
    calidad_agua: answers.calidad_agua, problema: answers.problema,
    soporte: answers.soporte || "", mejora: (answers.mejora || "").trim(),
    utm_source: params.get("utm_source") || "", user_agent: navigator.userAgent
  };
  try{
    // text/plain evita el bloqueo CORS de Apps Script
    await fetch(ENDPOINT, {method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)});
    try{ localStorage.setItem("simple_encuesta_"+VERSION+"_"+cliente, "1"); }catch(e){}
    thanks();
  }catch(e){
    btn.disabled = false; btn.textContent = "Enviar";
    document.getElementById("err").textContent = "No pudimos enviar tu respuesta. Revisa tu conexión e intenta de nuevo.";
  }
}

function thanks(){
  app.innerHTML = `<div class="done"><span class="brand">SIMPLE</span>
    <h1>¡Gracias por tu tiempo!</h1>
    <p class="hint">Tus respuestas nos ayudan a cuidar mejor tu agua y tu servicio.</p></div>`;
}

let ya = false;
try{ ya = localStorage.getItem("simple_encuesta_"+VERSION+"_"+cliente) === "1"; }catch(e){}
ya ? (app.innerHTML = `<div class="done"><span class="brand">SIMPLE</span><h1>Ya recibimos tu respuesta</h1><p class="hint">¡Gracias! No necesitas contestarla de nuevo.</p></div>`) : render();
</script>
</body>
</html>
